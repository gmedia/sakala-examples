# Version updates wait 7 days after a release so a hijacked package is usually
# caught before it lands. Security updates are separate and skip the cooldown.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/node-express"
    schedule:
      interval: "monthly"
      timezone: "Asia/Jakarta"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/node-s3"
    schedule:
      interval: "monthly"
      timezone: "Asia/Jakarta"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "composer"
    directory: "/laravel"
    schedule:
      interval: "monthly"
      timezone: "Asia/Jakarta"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Jakarta"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
