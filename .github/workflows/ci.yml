name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@11.21.1 static-site/public

  node-express:
    name: Node Express
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-express
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-express/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Smoke test npm start
        run: |
          PORT=8080 npm start &
          for attempt in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Halo dari Express di Sakala"
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'

  node-s3:
    name: Node S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-s3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-s3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Smoke test npm start without a bucket
        # Same situation as a first deploy on Sakala: no bucket attached yet,
        # so no AWS_* variables. The app must start and explain what to do.
        run: |
          PORT=8080 npm start &
          for attempt in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/ | grep -q "Bucket belum dipasang"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/files)" = 503
          curl -s http://127.0.0.1:8080/api/files | grep -q '"error":"BUCKET_NOT_CONFIGURED"'

  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Smoke test without a database
        # Same situation as a first deploy on Sakala: no .env, no database
        # variables, only APP_KEY. The release command must still exit 0.
        run: |
          export APP_KEY="$(php artisan key:generate --show)" APP_ENV=production APP_DEBUG=false
          php artisan migrate --force
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/up && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q "database belum dihubungkan"

      - name: Test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  laravel-image:
    name: Laravel image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t sakala-example-laravel .

      - name: Run like Sakala does
        # Release command in a throwaway container, then the app with Sakala's
        # capability set and PORT, with no database configured.
        run: |
          APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          CAPS="--cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID --cap-add KILL --cap-add SETGID --cap-add SETUID --cap-add NET_BIND_SERVICE --security-opt no-new-privileges"
          docker run --rm $CAPS -e APP_KEY="$APP_KEY" sakala-example-laravel php artisan migrate --force
          docker run -d --name app $CAPS -e APP_KEY="$APP_KEY" -e PORT=8123 -p 127.0.0.1:8123:8123 sakala-example-laravel
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8123/up && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8123/ | grep -q "database belum dihubungkan" || { docker logs app; exit 1; }

  laravel-queue:
    name: Laravel queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Smoke test without a database
        # A first deploy on Sakala: no .env, no database or Valkey variables,
        # only APP_KEY. The release command must still exit 0, and the worker
        # must idle on the sync queue instead of failing.
        run: |
          export APP_KEY="$(php artisan key:generate --show)" APP_ENV=production APP_DEBUG=false
          php artisan migrate --force
          test "$(php artisan config:show queue.default | grep -c sync)" -ge 1
          timeout 5 php artisan queue:work --stop-when-empty
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/up && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q "database belum dihubungkan"

      - name: Test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  laravel-queue-image:
    name: Laravel queue image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t sakala-example-laravel-queue .

      - name: Run web, worker, and schedule like Sakala does
        # PostgreSQL and Valkey in containers, then the release command, web,
        # worker, and one-off commands from the same image; once with Valkey
        # and once with the database queue.
        run: tests/image-smoke.sh sakala-example-laravel-queue
